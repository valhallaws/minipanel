location = /server-terminal {
    return 301 /server-terminal/;
}

location = /server-terminal/auth {
    internal;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI /server-terminal/auth;
    fastcgi_param QUERY_STRING "";
    fastcgi_param REQUEST_METHOD GET;
    fastcgi_pass unix:/run/php/minipanel-control.sock;
}

location ^~ /server-terminal/ {
    auth_request /server-terminal/auth;
    proxy_pass http://127.0.0.1:7681;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-MiniPanel-Terminal authenticated;
    proxy_read_timeout 86400;
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</head>' '<script>(()=>{const NativeWebSocket=window.WebSocket;function PanelWebSocket(...args){const socket=new NativeWebSocket(...args);window.__minipanelTerminalSocket=socket;return socket;}PanelWebSocket.prototype=NativeWebSocket.prototype;Object.setPrototypeOf(PanelWebSocket,NativeWebSocket);window.WebSocket=PanelWebSocket;window.addEventListener("keydown",event=>{if(event.metaKey&&!event.ctrlKey&&!event.altKey&&event.key.toLowerCase()==="k"){event.preventDefault();event.stopImmediatePropagation();const socket=window.__minipanelTerminalSocket;if(socket&&socket.readyState===NativeWebSocket.OPEN){socket.send("\u000c");}}},true);})();</script></head>';
}
