<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sitio en preparación</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #edf5ff; background: radial-gradient(circle at 15% 20%, #174e9e 0, transparent 32%), radial-gradient(circle at 85% 80%, #0e9489 0, transparent 34%), #111d2b; }
    main { width: min(520px, 100%); padding: 48px; border: 1px solid #38506a; border-radius: 24px; background: rgba(21, 34, 50, .88); box-shadow: 0 28px 70px rgba(0, 0, 0, .35); text-align: center; }
    .mark { width: 76px; height: 76px; margin: 0 auto 28px; display: grid; place-items: center; border-radius: 22px; background: linear-gradient(145deg, #54b7ff, #1f65d5); font-size: 40px; font-weight: 800; font-style: italic; box-shadow: inset 0 1px rgba(255,255,255,.4); }
    small { color: #79d4bb; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-family: Georgia, serif; font-size: clamp(34px, 7vw, 52px); }
    p { margin: 0; color: #b5c4d4; font-size: 17px; line-height: 1.65; }
    footer { margin-top: 30px; color: #7f96ae; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">F</div>
    <small>Freyja · control del VPS</small>
    <h1>Estamos preparando este sitio.</h1>
    <p>El dominio ya está protegido y listo para recibir su aplicación.</p>
    <footer>Administrado con Freyja</footer>
  </main>
</body>
</html>
